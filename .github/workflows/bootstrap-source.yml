name: Bootstrap source
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore source
        shell: bash
        run: |
          set -euo pipefail
          test -d .bootstrap || exit 0
          cat .bootstrap/payload.* | base64 -d > /tmp/pal-learning-source.tar.gz
          tar -xzf /tmp/pal-learning-source.tar.gz
          rm -rf .bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: import Palestinian Learning OS V1.0 source"
          git push
