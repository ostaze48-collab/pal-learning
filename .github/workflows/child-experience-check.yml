name: Child Experience Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: child-experience-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Child-facing copy guard
        run: npm run qa:child-copy
      - name: Production build
        run: npm run build
      - name: Child journey route smoke test
        shell: bash
        run: |
          npm start -- -p 3000 > /tmp/salma-sama-next.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT
          READY=0
          for i in {1..30}; do
            if curl -fsSL http://127.0.0.1:3000/student/salma > /dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" != "1" ]; then
            cat /tmp/salma-sama-next.log
            exit 1
          fi
          for path in \
            /student/salma \
            /student/sama \
            /lesson/g5-science-cell-types \
            /lesson/g5-science-cell-types/reteach \
            /student/salma/practice \
            /student/salma/resources; do
            echo "Checking $path"
            curl -fsSL "http://127.0.0.1:3000$path" > /dev/null || {
              cat /tmp/salma-sama-next.log
              exit 1
            }
          done
