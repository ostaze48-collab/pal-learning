name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API dependencies
        run: |
          cd apps/api
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx2
      - name: Verify Alembic migration head
        working-directory: apps/api
        env:
          DATABASE_URL: sqlite:///./migration-ci.db
        run: |
          rm -f migration-ci.db
          alembic upgrade head
          python - <<'PY'
          from sqlalchemy import create_engine, inspect, text
          engine = create_engine('sqlite:///./migration-ci.db')
          with engine.connect() as connection:
              revision = connection.execute(text('SELECT version_num FROM alembic_version')).scalar_one()
          inspector = inspect(engine)
          tables = inspector.get_table_names()
          visual_columns = {row['name'] for row in inspector.get_columns('visual_assets')}
          assert revision == '20261027_04', revision
          assert 'release_transactions' in tables
          assert 'visual_assets' in tables
          assert {'parent_asset_id','region_key','crop_box_json'} <= visual_columns
          print(f'Alembic head verified: {revision}')
          PY
      - name: Run API tests
        env:
          DATABASE_URL: sqlite:///./ci.db
          PYTHONPATH: apps/api
        run: pytest -q

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked dependencies
        working-directory: apps/web
        run: npm ci
      - name: Audit production dependencies
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high
      - name: Build web
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: https://pal-learning-api.onrender.com
        run: npm run build
