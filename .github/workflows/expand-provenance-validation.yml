name: Expand generated-content provenance validation
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch-provenance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Expand provenance validator and update tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          router = Path('apps/api/app/factory/router.py')
          text = router.read_text()
          start = text.index('def _store_candidate(')
          end = text.index("\n\n@router.post('/jobs/{job_id}/ingest-output')", start)
          new_func = '''def _store_candidate(job: AIJob, payload: GeneratedLessonPayload, db: Session) -> dict:
              if job.job_type != 'GENERATE_LESSON' or job.source_type != 'LESSON' or not job.source_id:
                  raise HTTPException(409, 'Job is not a lesson-generation job')

              packet = job.input_json or {}
              allowed_chunks = {x.get('source_chunk_id') for x in packet.get('source_context', []) if x.get('source_chunk_id')}
              allowed_skills = {x.get('skill_code') for x in packet.get('skills', []) if x.get('skill_code')}
              output = payload.model_dump()

              invalid_chunks = []
              unknown_skills = []
              cited = 0
              total_citable = 0

              def validate_artifact(item: dict, where: str, *, check_skills: bool = False) -> None:
                  nonlocal cited, total_citable
                  total_citable += 1
                  refs = item.get('source_chunk_ids', [])
                  if refs:
                      cited += 1
                  for ref in refs:
                      if ref not in allowed_chunks:
                          invalid_chunks.append({'where': where, 'ref': ref})
                  if check_skills:
                      for code in item.get('skill_codes', []):
                          if code not in allowed_skills:
                              unknown_skills.append(code)

              for section in output.get('sections', []):
                  for block in section.get('blocks', []):
                      validate_artifact(block, 'block')
              for question in output.get('questions', []):
                  validate_artifact(question, 'question', check_skills=True)
              for item in output.get('summary', []):
                  validate_artifact(item, 'summary')
              for item in output.get('flashcards', []):
                  validate_artifact(item, 'flashcard')
              for item in output.get('misconceptions', []):
                  validate_artifact(item, 'misconception', check_skills=True)
              for item in output.get('remediation_candidates', []):
                  validate_artifact(item, 'remediation', check_skills=True)

              provenance_score = round(100 * cited / total_citable, 1) if total_citable else 0.0
              valid = not invalid_chunks and not unknown_skills and provenance_score == 100.0
              count = db.query(ContentCandidate).filter(ContentCandidate.lesson_id == job.source_id).count() + 1
              candidate = ContentCandidate(
                  lesson_id=job.source_id, ai_job_id=job.id, version_label=f'candidate-{count}',
                  status='READY_FOR_QA' if valid else 'REJECTED',
                  schema_valid=True, provenance_score=provenance_score, output_json=output,
                  validation_json={
                      'allowed_chunk_ids': sorted(allowed_chunks),
                      'invalid_chunk_refs': invalid_chunks,
                      'unknown_skill_codes': sorted(set(unknown_skills)),
                      'citable_items': total_citable,
                      'cited_items': cited,
                      'all_citable_items_have_refs': provenance_score == 100.0,
                  },
              )
              db.add(candidate)
              job.status = 'OUTPUT_VALIDATED' if valid else 'OUTPUT_REJECTED'
              job.progress = 70 if valid else 60
              db.commit(); db.refresh(candidate)
              return {
                  'candidate_id': candidate.id, 'version_label': candidate.version_label,
                  'status': candidate.status, 'schema_valid': candidate.schema_valid,
                  'provenance_score': candidate.provenance_score,
                  'validation': candidate.validation_json,
              }
          '''
          # normalize indentation introduced by the triple-quoted source above
          import textwrap
          router.write_text(text[:start] + textwrap.dedent(new_func) + text[end:])

          test = Path('tests/test_api_flow.py')
          t = test.read_text()
          old = """        'summary': ['الجهاز الهيكلي يساعد على دعامة الجسم.'],
                  'flashcards': [],
                  'misconceptions': [],
                  'remediation_candidates': [],
          """
          new = """        'summary': [{'text': 'الجهاز الهيكلي يساعد على دعامة الجسم.', 'source_chunk_ids': [chunk_id]}],
                  'flashcards': [{'front': 'ما وظيفة الدعامة؟', 'back': 'يساعد الهيكل على دعامة الجسم.', 'source_chunk_ids': [chunk_id]}],
                  'misconceptions': [{
                      'title': 'الهيكل للحركة فقط',
                      'incorrect_idea': 'وظيفة الجهاز الهيكلي هي الحركة فقط.',
                      'correction': 'للجهاز الهيكلي وظائف منها الدعامة والحماية والمساعدة على الحركة.',
                      'skill_codes': [skill_code],
                      'source_chunk_ids': [chunk_id],
                  }],
                  'remediation_candidates': [{
                      'title': 'مراجعة سريعة: وظيفة الدعامة',
                      'trigger': 'خلط وظيفة الدعامة بوظائف أخرى.',
                      'explanation': 'العظام تمنح الجسم دعامة وشكلًا.',
                      'practice_prompt': 'اذكر مثالًا يوضح دور الدعامة.',
                      'mastery_check': 'ما وظيفة الدعامة التي يوفرها الجهاز الهيكلي؟',
                      'skill_codes': [skill_code],
                      'source_chunk_ids': [chunk_id],
                  }],
          """
          if old not in t:
              raise SystemExit('valid generated payload block not found')
          t = t.replace(old, new)
          marker = "\n\ndef test_retention_review_and_daily_plan():"
          extra_test = """

          def test_structured_output_rejects_out_of_packet_flashcard_source():
              client.post('/importer/source-packages/1/link-lessons', headers=ADMIN_HEADERS)
              queued = client.post('/factory/lessons/1/generate', headers=ADMIN_HEADERS).json()
              job = client.get(f\"/factory/jobs/{queued['job_id']}\", headers=ADMIN_HEADERS).json()
              chunk_id = job['input']['source_context'][0]['source_chunk_id']
              skill_code = job['input']['skills'][0]['skill_code']
              payload = _valid_generated_payload(chunk_id, skill_code)
              payload['flashcards'][0]['source_chunk_ids'] = [999999]
              r = client.post(f\"/factory/jobs/{queued['job_id']}/ingest-output\", json=payload, headers=ADMIN_HEADERS)
              assert r.status_code == 200
              data = r.json()
              assert data['status'] == 'REJECTED'
              assert any(x['where'] == 'flashcard' for x in data['validation']['invalid_chunk_refs'])
          """
          if marker not in t:
              raise SystemExit('retention test marker not found')
          t = t.replace(marker, extra_test + marker)
          test.write_text(t)

          strict_test = Path('tests/test_generated_payload_strictness.py')
          s = strict_test.read_text()
          s = s.replace(
              "'summary': ['الجهاز الهيكلي يساعد على دعامة الجسم.'],",
              "'summary': [{'text': 'الجهاز الهيكلي يساعد على دعامة الجسم.', 'source_chunk_ids': [1]}],",
          )
          strict_test.write_text(s)
          PY
      - name: Verify API tests
        run: |
          cd apps/api
          python -m pip install --upgrade pip >/dev/null
          pip install -r requirements.txt pytest httpx2 >/dev/null
          cd ../..
          DATABASE_URL=sqlite:///./provenance-ci.db PYTHONPATH=apps/api pytest -q
      - name: Commit patch and self-remove
        run: |
          rm .github/workflows/expand-provenance-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/app/factory/router.py tests/test_api_flow.py tests/test_generated_payload_strictness.py .github/workflows/expand-provenance-validation.yml
          git commit -m "qa: validate provenance for all generated lesson artifacts"
          git push
