name: Harden official PDF import
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  harden-import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch remote content detection and prompt version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          router = Path('apps/api/app/importer/router.py')
          text = router.read_text()
          marker = """class _SafeRedirectHandler(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  _validate_source_url(newurl)
                  return super().redirect_request(req, fp, code, msg, headers, newurl)


          def _download_registered_source(url: str) -> tuple[bytes, str | None, str]:
          """
          replacement = """class _SafeRedirectHandler(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  _validate_source_url(newurl)
                  return super().redirect_request(req, fp, code, msg, headers, newurl)


          def _normalize_remote_content_type(reported_content_type: str | None, data: bytes) -> str:
              # Trust the file signature over a generic/misconfigured HTTP MIME header.
              # This lets official PDF endpoints work even when served as octet-stream,
              # while arbitrary binary content remains rejected.
              if data.startswith(b'%PDF-'):
                  return 'application/pdf'
              reported = (reported_content_type or '').lower()
              if reported in {'text/plain', 'text/markdown'}:
                  return reported
              raise ValueError(f'Unsupported remote curriculum content type: {reported or "unknown"}')


          def _download_registered_source(url: str) -> tuple[bytes, str | None, str]:
          """
          if marker not in text:
              raise SystemExit('redirect/download marker not found')
          text = text.replace(marker, replacement, 1)

          old = """            content_type = (response.headers.get_content_type() or '').lower() or None
                      if content_type not in {'application/pdf', 'text/plain', 'text/markdown'}:
                          raise ValueError(f'Unsupported remote curriculum content type: {content_type or \"unknown\"}')
                      length_header = response.headers.get('Content-Length')
          """
          new = """            reported_content_type = (response.headers.get_content_type() or '').lower() or None
                      length_header = response.headers.get('Content-Length')
          """
          if old not in text:
              raise SystemExit('content type guard block not found')
          text = text.replace(old, new, 1)
          old_read = """            data = response.read(MAX_SOURCE_BYTES + 1)
              except (HTTPError, URLError, TimeoutError) as exc:
          """
          new_read = """            data = response.read(MAX_SOURCE_BYTES + 1)
                      content_type = _normalize_remote_content_type(reported_content_type, data)
              except (HTTPError, URLError, TimeoutError) as exc:
          """
          if old_read not in text:
              raise SystemExit('remote read block not found')
          text = text.replace(old_read, new_read, 1)
          router.write_text(text)

          factory = Path('apps/api/app/factory/router.py')
          f = factory.read_text()
          if "prompt_version='lesson_generator/v1'" not in f:
              raise SystemExit('lesson generator v1 marker not found')
          factory.write_text(f.replace("prompt_version='lesson_generator/v1'", "prompt_version='lesson_generator/v2'", 1))

          test = Path('tests/test_source_fetch_security.py')
          t = test.read_text()
          if '_normalize_remote_content_type' not in t:
              t = t.replace(
                  'from app.importer.router import _validate_source_url',
                  'from app.importer.router import _normalize_remote_content_type, _validate_source_url',
              )
              t += """

          def test_remote_pdf_signature_overrides_generic_mime():
              assert _normalize_remote_content_type('application/octet-stream', b'%PDF-1.7\\nbody') == 'application/pdf'
              assert _normalize_remote_content_type('application/x-pdf', b'%PDF-1.4\\nbody') == 'application/pdf'


          def test_remote_binary_without_pdf_signature_is_rejected():
              with pytest.raises(ValueError, match='Unsupported remote curriculum content type'):
                  _normalize_remote_content_type('application/octet-stream', b'not-a-pdf')
          """
          test.write_text(t)
          PY
      - name: Verify API tests
        run: |
          cd apps/api
          python -m pip install --upgrade pip >/dev/null
          pip install -r requirements.txt pytest httpx2 >/dev/null
          cd ../..
          DATABASE_URL=sqlite:///./official-pdf-ci.db PYTHONPATH=apps/api pytest -q
      - name: Verify audited web build
        working-directory: apps/web
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          NEXT_PUBLIC_API_URL=https://pal-learning-api.onrender.com npm run build
      - name: Commit verified patch and self-remove
        run: |
          rm .github/workflows/harden-official-pdf-import.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: harden official PDF import and version lesson generator"
          git pull --rebase origin main
          git push origin main
