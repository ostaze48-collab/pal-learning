name: Lock patched web dependencies
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  lock-web:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate deterministic lockfile
        working-directory: apps/web
        run: npm install --package-lock-only
      - name: Verify locked production dependencies
        working-directory: apps/web
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          NEXT_PUBLIC_API_URL=https://pal-learning-api.onrender.com npm run build
      - name: Commit lockfile and self-remove
        run: |
          rm .github/workflows/lock-web-dependencies.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package-lock.json .github/workflows/lock-web-dependencies.yml
          git commit -m "security: lock audited web dependencies"
          git push
