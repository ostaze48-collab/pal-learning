name: Normalize official source confidence
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch-seed:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize seeded official-source confidence
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/api/app/db/seed.py')
          text=p.read_text()
          text=text.replace(
              "reliability_score=100, edition_match_score=95, status='DISCOVERED'",
              "reliability_score=100, edition_match_score=0, status='DISCOVERED'"
          )
          needle="""            db.add(official_package); db.flush()\n\n        # Historical full student book remains only a structure/reference fallback.\n"""
          replacement="""            db.add(official_package); db.flush()\n        # Authority and edition evidence are separate. Until the file itself is\n        # imported and analyzed, edition match remains unknown (0), even for an\n        # authoritative Ministry source. Normalize existing seeded databases too.\n        official_package.source_url = 'https://moe.edu.ps/m/4070'\n        official_package.edition = 'current official Gaza learning package'\n        official_package.reliability_score = 100\n        official_package.edition_match_score = 0\n\n        # Historical full student book remains only a structure/reference fallback.\n"""
          if needle in text:
              text=text.replace(needle,replacement)
          elif 'official_package.edition_match_score = 0' not in text:
              raise SystemExit('official package normalization insertion point not found')
          p.write_text(text)
          PY
      - name: Verify API tests
        run: |
          cd apps/api
          pip install -r requirements.txt pytest httpx2 >/dev/null
          DATABASE_URL=sqlite:///./seed-normalize-ci.db PYTHONPATH=. pytest -q ../../tests
      - name: Commit and self-remove
        run: |
          rm .github/workflows/normalize-official-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep official source edition confidence unverified until import"
          git push
