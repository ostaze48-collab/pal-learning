name: Promote official Grade 5 science source
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch-source-registry:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch source registry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          seed = Path('apps/api/app/db/seed.py')
          text = seed.read_text()
          old = """        source_file = db.query(SourceFile).filter_by(package_id=package.id, source_type='STUDENT_BOOK').first()\n        if not source_file:\n            source_file = SourceFile(\n                package_id=package.id, source_type='STUDENT_BOOK',\n                source_url='https://download.sh-pal.com/2021/02/2020-2021_78.html?m=1',\n                original_filename='historical-reference-link-not-2026-verified', edition='2020-2021 reference',\n                reliability_score=75, edition_match_score=0, status='DISCOVERED'\n            )\n            db.add(source_file); db.flush()\n"""
          new = """        # Official current learning-package source from the Palestinian Ministry of Education.\n        # It is authoritative for the current Gaza package, but does not by itself prove\n        # that the complete 2026 textbook edition has been verified.\n        official_package = db.query(SourceFile).filter_by(package_id=package.id, source_type='OFFICIAL_PACKAGE').first()\n        if not official_package:\n            official_package = SourceFile(\n                package_id=package.id, source_type='OFFICIAL_PACKAGE',\n                source_url='https://moe.edu.ps/m/4070',\n                original_filename='moe-current-grade5-science-learning-package',\n                edition='current official Gaza learning package',\n                reliability_score=100, edition_match_score=95, status='DISCOVERED'\n            )\n            db.add(official_package); db.flush()\n\n        # Historical full student book remains only a structure/reference fallback.\n        source_file = db.query(SourceFile).filter_by(package_id=package.id, source_type='STUDENT_BOOK').first()\n        if not source_file:\n            source_file = SourceFile(\n                package_id=package.id, source_type='STUDENT_BOOK',\n                source_url='https://download.sh-pal.com/2021/02/2020-2021_78.html?m=1',\n                original_filename='historical-reference-link-not-2026-verified', edition='2020-2021 reference',\n                reliability_score=75, edition_match_score=0, status='DISCOVERED'\n            )\n            db.add(source_file); db.flush()\n\n        solutions_file = db.query(SourceFile).filter_by(package_id=package.id, source_type='SOLUTIONS').first()\n        if not solutions_file:\n            solutions_file = SourceFile(\n                package_id=package.id, source_type='SOLUTIONS',\n                source_url='https://www.sh-pal.com/2018/01/blog-post_675.html',\n                original_filename='science-grade5-sem2-model-answers-reference',\n                edition='edition-not-yet-matched-to-current-package',\n                reliability_score=85, edition_match_score=0, status='DISCOVERED'\n            )\n            db.add(solutions_file); db.flush()\n"""
          if old in text:
              seed.write_text(text.replace(old, new))
          elif 'moe.edu.ps/m/4070' not in text:
              raise SystemExit('seed source block not found')

          imp = Path('apps/api/app/importer/router.py')
          t = imp.read_text()
          oldw = """SOURCE_WEIGHTS = {\n    'STUDENT_BOOK': 35,\n    'SOLUTIONS': 20,\n    'TEACHER_GUIDE': 15,\n    'WORKSHEET': 10,\n    'EXAM': 10,\n    'REMEDIAL': 5,\n    'INTERACTIVE': 3,\n    'VIDEO_REFERENCE': 2,\n}\n"""
          neww = """SOURCE_WEIGHTS = {\n    # 100 total. Current official learning packages are distinct from full textbooks.\n    'STUDENT_BOOK': 30,\n    'OFFICIAL_PACKAGE': 20,\n    'SOLUTIONS': 15,\n    'TEACHER_GUIDE': 10,\n    'WORKSHEET': 8,\n    'EXAM': 7,\n    'REMEDIAL': 5,\n    'INTERACTIVE': 3,\n    'VIDEO_REFERENCE': 2,\n}\n"""
          if oldw in t:
              imp.write_text(t.replace(oldw, neww))
          elif "'OFFICIAL_PACKAGE': 20" not in t:
              raise SystemExit('source weights block not found')
          PY
      - name: Verify tests
        run: |
          cd apps/api
          python -m pip install --upgrade pip >/dev/null
          pip install -r requirements.txt pytest >/dev/null
          DATABASE_URL=sqlite:///./official-source-ci.db PYTHONPATH=. pytest -q ../../tests
      - name: Commit patch and self-remove
        run: |
          rm .github/workflows/promote-official-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: register current official Grade 5 science source"
          git push
