name: Restore importer router

on:
  push:
    paths:
      - '.github/workflows/restore-importer-router.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore known-good router and apply narrow patches
        run: |
          git show e2ffe7d05adec0d98d4966ae7f3decdde11f366e:apps/api/app/importer/router.py > apps/api/app/importer/router.py
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/api/app/importer/router.py')
          s = p.read_text()
          old = "DEFAULT_SOURCE_HOSTS = 'moe.edu.ps,www.sh-pal.com,sh-pal.com,download.sh-pal.com'"
          new = "DEFAULT_SOURCE_HOSTS = 'moe.edu.ps,www.sh-pal.com,sh-pal.com,download.sh-pal.com,elearn.edu.ps,elearnps.blob.core.windows.net'"
          if old not in s:
              raise SystemExit('DEFAULT_SOURCE_HOSTS marker not found')
          s = s.replace(old, new, 1)

          old_redirect = """    row.extracted_text = extracted.text\n    row.source_url = source_url or row.source_url\n    row.extraction_meta = {\n        'method': extracted.extraction_method,"""
          new_redirect = """    row.extracted_text = extracted.text\n    registered_url = row.source_url\n    if not registered_url and source_url:\n        row.source_url = source_url\n    row.extraction_meta = {\n        **dict(row.extraction_meta or {}),\n        'method': extracted.extraction_method,"""
          if old_redirect in s:
              s = s.replace(old_redirect, new_redirect, 1)
              s = s.replace("        'final_source_url': source_url,", "        'registered_source_url': registered_url or row.source_url,\n        'final_source_url': source_url,", 1)
          elif "'registered_source_url':" not in s:
              raise SystemExit('redirect identity patch marker not found')
          p.write_text(s)
          PY
      - name: Sync discovery-catalog v2 tests
        run: |
          cat > tests/test_source_discovery_catalog.py <<'PY'
          from app.importer.discovery_catalog import (
              SOURCE_DISCOVERY_CATALOG,
              discoveries_for_package,
              list_source_discoveries,
          )
          from app.importer.source_policy import can_ground_facts, can_prove_current_scope


          def test_grade5_science_current_plan_is_discovery_only():
              rows = discoveries_for_package('PS-G05-SCI-S2-2026')
              assert len(rows) == 1
              row = rows[0]
              assert row.intended_source_type == 'CURRICULUM_PLAN'
              assert row.grade_code == 'G05'
              assert row.subject_code == 'SCI'
              assert row.semester == 2
              assert row.academic_year == '2025/2026'
              assert row.file_verified is False
              assert row.ingestion_mode == 'UPLOAD_REQUIRED'
              assert row.discovery_kind == 'SECONDARY_INDEX'


          def test_discovered_plan_type_can_prove_scope_but_cannot_ground_facts():
              row = next(x for x in SOURCE_DISCOVERY_CATALOG if x.source_code == 'PS.G05.SCI.S2.PLAN.2025_2026.DISCOVERY')
              assert can_prove_current_scope(row.intended_source_type) is True
              assert can_ground_facts(row.intended_source_type) is False


          def test_discovery_endpoint_policy_is_fail_closed_and_explicit():
              result = list_source_discoveries('PS-G05-SCI-S2-2026')
              assert result['catalog_version'] == 'source-discovery/v2'
              assert len(result['entries']) == 1
              assert result['policy']['unverified_discovery_creates_source_files'] is False
              assert result['policy']['verified_direct_file_registration_requires_admin'] is True
              assert result['policy']['adds_package_coverage_before_fetch'] is False
              assert result['policy']['authorizes_generation'] is False
              assert result['policy']['required_next_step'] == 'REGISTER_VERIFIED_DIRECT_FILE_OR_OBTAIN_AND_UPLOAD_ACTUAL_FILE'
          PY
      - name: Install API dependencies
        run: |
          cd apps/api
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx2
      - name: Run API tests
        env:
          DATABASE_URL: sqlite:///./ci-restore.db
          PYTHONPATH: apps/api
        run: pytest -q
      - name: Commit verified restoration and remove temporary workflow
        run: |
          rm .github/workflows/restore-importer-router.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/app/importer/router.py tests/test_source_discovery_catalog.py .github/workflows/restore-importer-router.yml
          git commit -m "fix: restore complete curriculum importer router"
          git pull --rebase origin main
          git push origin HEAD:main
