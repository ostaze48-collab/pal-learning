name: Synchronize strict provenance fixtures
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  sync-fixtures:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch strict provenance fixtures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          for filename in ['tests/test_api_flow.py', 'tests/test_candidate_staging.py']:
              p = Path(filename)
              t = p.read_text()
              old = "'summary': ['الجهاز الهيكلي يساعد على دعامة الجسم.'],"
              new = "'summary': [{'text': 'الجهاز الهيكلي يساعد على دعامة الجسم.', 'source_chunk_ids': [chunk_id]}],"
              if old in t:
                  t = t.replace(old, new)
              p.write_text(t)

          p = Path('tests/test_generated_payload_strictness.py')
          t = p.read_text()
          old = "'summary': ['الجهاز الهيكلي يساعد على دعامة الجسم.'],"
          new = "'summary': [{'text': 'الجهاز الهيكلي يساعد على دعامة الجسم.', 'source_chunk_ids': [1]}],"
          if old in t:
              t = t.replace(old, new)
          p.write_text(t)

          p = Path('tests/test_api_flow.py')
          t = p.read_text()
          marker = "\n\ndef test_retention_review_and_daily_plan():"
          if 'test_structured_output_rejects_out_of_packet_flashcard_source' not in t:
              extra = '''

          def test_structured_output_rejects_out_of_packet_flashcard_source():
              client.post('/importer/source-packages/1/link-lessons', headers=ADMIN_HEADERS)
              queued = client.post('/factory/lessons/1/generate', headers=ADMIN_HEADERS).json()
              job = client.get(f"/factory/jobs/{queued['job_id']}", headers=ADMIN_HEADERS).json()
              chunk_id = job['input']['source_context'][0]['source_chunk_id']
              skill_code = job['input']['skills'][0]['skill_code']
              payload = _valid_generated_payload(chunk_id, skill_code)
              payload['flashcards'] = [{
                  'front': 'ما وظيفة الدعامة؟',
                  'back': 'يساعد الهيكل على دعامة الجسم.',
                  'source_chunk_ids': [999999],
              }]
              r = client.post(f"/factory/jobs/{queued['job_id']}/ingest-output", json=payload, headers=ADMIN_HEADERS)
              assert r.status_code == 200
              data = r.json()
              assert data['status'] == 'REJECTED'
              assert any(x['where'] == 'flashcard' for x in data['validation']['invalid_chunk_refs'])
          '''
              import textwrap
              if marker not in t:
                  raise SystemExit('retention marker not found')
              t = t.replace(marker, textwrap.dedent(extra) + marker)
              p.write_text(t)
          PY
      - name: Verify API tests
        run: |
          cd apps/api
          python -m pip install --upgrade pip >/dev/null
          pip install -r requirements.txt pytest httpx2 >/dev/null
          cd ../..
          DATABASE_URL=sqlite:///./strict-provenance-ci.db PYTHONPATH=apps/api pytest -q
      - name: Commit patch and self-remove
        run: |
          rm .github/workflows/sync-strict-provenance-fixtures.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_api_flow.py tests/test_candidate_staging.py tests/test_generated_payload_strictness.py .github/workflows/sync-strict-provenance-fixtures.yml
          git commit -m "test: align fixtures with strict provenance contract"
          git push
