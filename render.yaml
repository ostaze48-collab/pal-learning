services:
  - type: web
    name: pal-learning-api
    runtime: python
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pal-learning-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
  - type: web
    name: pal-learning-web
    runtime: node
    rootDir: apps/web
    buildCommand: npm install && npm run build
    startCommand: npm run start -- -p $PORT
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false

databases:
  - name: pal-learning-db
    databaseName: pal_learning
    user: pal_learning
